openapi: 3.0.3
info:
  title: Cron Metrics Collector & Exporter API
  description: |
    A Go-based API and web server to centralize cron job results and export their statuses as Prometheus-compatible metrics.

    ## Authentication

    The API uses a two-tier authentication system:

    ### Admin API Keys
    - **Purpose**: Job management operations (CRUD)
    - **Header**: `Authorization: Bearer <admin-api-key>`
    - **Endpoints**: All `/api/job*` endpoints

    ### Per-Job API Keys
    - **Purpose**: Job result submissions (isolated per job)
    - **Header**: `X-API-Key <job-specific-api-key>`
    - **Endpoints**: `/api/job-result`
    - **Security**: Jobs can only submit results for themselves

  version: 0.3.0
  contact:
    name: Cron Exporter API Support
    url: https://github.com/jaepetto/cron-exporter
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Development server
  - url: https://cronmetrics.example.com
    description: Production server

paths:
  # Job Management Endpoints (Admin API Key Required)
  /api/job:
    get:
      summary: List all jobs
      description: Retrieve a list of all registered cron jobs with optional label filtering
      tags:
        - Job Management
      security:
        - AdminAPIKey: []
      parameters:
        - name: label
          in: query
          description: "Filter jobs by label (format: key=value)"
          required: false
          schema:
            type: string
            example: "env=prod"
      responses:
        '200':
          description: Successfully retrieved job list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: Create a new job
      description: Register a new cron job with automatic API key generation
      tags:
        - Job Management
      security:
        - AdminAPIKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '201':
          description: Job created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/job/{id}:
    get:
      summary: Get job by ID
      description: Retrieve a specific job by its ID
      tags:
        - Job Management
      security:
        - AdminAPIKey: []
      parameters:
        - name: id
          in: path
          required: true
          description: Job ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Successfully retrieved job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      summary: Update job by ID
      description: Update an existing job configuration
      tags:
        - Job Management
      security:
        - AdminAPIKey: []
      parameters:
        - name: id
          in: path
          required: true
          description: Job ID
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJobRequest'
      responses:
        '200':
          description: Job updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      summary: Delete job by ID
      description: Remove a job from the system
      tags:
        - Job Management
      security:
        - AdminAPIKey: []
      parameters:
        - name: id
          in: path
          required: true
          description: Job ID
          schema:
            type: integer
            example: 1
      responses:
        '204':
          description: Job deleted successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # Job Result Submission (Per-Job API Key Required)
  /api/job-result:
    post:
      summary: Submit job execution result
      description: Submit the result of a cron job execution using the job's unique API key
      tags:
        - Job Results
      security:
        - JobAPIKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobResult'
      responses:
        '201':
          description: Job result submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # Public Endpoints (No Authentication Required)
  /metrics:
    get:
      summary: Prometheus metrics
      description: Retrieve Prometheus-formatted metrics for all registered jobs
      tags:
        - Monitoring
      responses:
        '200':
          description: Prometheus metrics in text format
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP cronjob_status Status of cron job: 1=success, 0=failure, -1=maintenance/paused, -2=missed_deadline
                  # TYPE cronjob_status gauge
                  cronjob_status{job_name="backup",host="web1",env="prod"} 1
                  cronjob_status{job_name="maintenance_job",host="web2"} -1
                  cronjob_status{job_name="old_job",host="web3"} -2

                  # HELP cronjob_last_run_timestamp Timestamp of last job execution
                  # TYPE cronjob_last_run_timestamp gauge
                  cronjob_last_run_timestamp{job_name="backup",host="web1"} 1698696960

                  # HELP cronjob_total Total number of registered cron jobs
                  # TYPE cronjob_total gauge
                  cronjob_total 2

  /health:
    get:
      summary: Health check
      description: Check the health status of the API server
      tags:
        - Health
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/config:
    get:
      summary: Get dashboard runtime configuration
      description: Returns non-secret configuration for the embedded portal. This path is relative to the configured dashboard base path.
      tags: [Dashboard]
      servers:
        - url: /dashboard
          description: Default dashboard base path
      security:
        - DashboardBasic: []
      responses:
        '200':
          description: Dashboard runtime configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardRuntimeConfig'
        '401':
          $ref: '#/components/responses/DashboardUnauthorizedError'

  /api/jobs:
    get:
      summary: Search dashboard jobs
      description: Returns a bounded, filtered page of jobs. This path is relative to the configured dashboard base path.
      tags: [Dashboard]
      servers:
        - url: /dashboard
          description: Default dashboard base path
      security:
        - DashboardBasic: []
      parameters:
        - name: q
          in: query
          schema: {type: string}
        - name: name
          in: query
          schema: {type: string}
        - name: host
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema:
            type: string
            enum: [active, maintenance, paused]
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
        - name: before
          in: query
          schema: {type: string, format: date-time}
        - name: after
          in: query
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: Paginated dashboard job results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSearchResult'
        '400':
          $ref: '#/components/responses/DashboardBadRequestError'
        '401':
          $ref: '#/components/responses/DashboardUnauthorizedError'
    post:
      summary: Create a dashboard job
      tags: [Dashboard]
      servers:
        - url: /dashboard
          description: Default dashboard base path
      security:
        - DashboardBasic: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '201':
          description: Job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/DashboardBadRequestError'
        '401':
          $ref: '#/components/responses/DashboardUnauthorizedError'
        '409':
          $ref: '#/components/responses/DashboardConflictError'

  /api/jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, minimum: 1}
    get:
      summary: Get a dashboard job
      tags: [Dashboard]
      servers:
        - url: /dashboard
          description: Default dashboard base path
      security:
        - DashboardBasic: []
      responses:
        '200':
          description: Job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/DashboardUnauthorizedError'
        '404':
          $ref: '#/components/responses/DashboardNotFoundError'
    put:
      summary: Update a dashboard job
      tags: [Dashboard]
      servers:
        - url: /dashboard
          description: Default dashboard base path
      security:
        - DashboardBasic: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJobRequest'
      responses:
        '200':
          description: Updated job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/DashboardBadRequestError'
        '401':
          $ref: '#/components/responses/DashboardUnauthorizedError'
        '404':
          $ref: '#/components/responses/DashboardNotFoundError'
        '409':
          $ref: '#/components/responses/DashboardConflictError'
    delete:
      summary: Delete a dashboard job
      tags: [Dashboard]
      servers:
        - url: /dashboard
          description: Default dashboard base path
      security:
        - DashboardBasic: []
      responses:
        '204':
          description: Job deleted
        '401':
          $ref: '#/components/responses/DashboardUnauthorizedError'
        '404':
          $ref: '#/components/responses/DashboardNotFoundError'

  /api/jobs/{id}/toggle:
    post:
      summary: Toggle dashboard job maintenance status
      tags: [Dashboard]
      servers:
        - url: /dashboard
          description: Default dashboard base path
      security:
        - DashboardBasic: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Toggled job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/DashboardUnauthorizedError'
        '404':
          $ref: '#/components/responses/DashboardNotFoundError'

  /events:
    get:
      summary: Stream dashboard invalidation events
      description: Opens an SSE stream relative to the configured dashboard base path. Event data uses the DashboardEvent schema.
      tags: [Dashboard]
      servers:
        - url: /dashboard
          description: Default dashboard base path
      security:
        - DashboardBasic: []
      responses:
        '200':
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/DashboardUnauthorizedError'
        '503':
          description: SSE disabled or client limit reached

components:
  securitySchemes:
    AdminAPIKey:
      type: http
      scheme: bearer
      description: Admin API key for job management operations

    JobAPIKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Per-job API key for result submissions

    DashboardBasic:
      type: http
      scheme: basic
      description: Dashboard username and an admin API key as the password

  schemas:
    Job:
      type: object
      properties:
        id:
          type: integer
          description: Auto-incrementing job ID
          example: 1
        job_name:
          type: string
          description: Unique job name
          example: "daily-backup"
        host:
          type: string
          description: Host where the job runs
          example: "db-server-01"
        api_key:
          type: string
          description: Per-job API key for result submissions
          example: "cm_abc123456789abcdef123456789abcdef123456789abcd"
        automatic_failure_threshold:
          type: integer
          description: Seconds after which job is considered failed if no result submitted
          example: 3600
        labels:
          type: object
          additionalProperties:
            type: string
          description: User-defined labels for the job
          example:
            env: "prod"
            team: "platform"
            type: "backup"
        status:
          type: string
          enum: ["active", "maintenance", "paused"]
          description: Job lifecycle status
          example: "active"
        last_reported_at:
          type: string
          format: date-time
          description: Timestamp of last result submission
          example: "2025-10-30T19:56:00Z"
        created_at:
          type: string
          format: date-time
          description: Job creation timestamp
          example: "2025-10-30T10:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: Job last update timestamp
          example: "2025-10-30T19:56:00Z"
      required:
        - id
        - job_name
        - host
        - automatic_failure_threshold
        - labels
        - status
        - last_reported_at
        - created_at
        - updated_at

    CreateJobRequest:
      type: object
      properties:
        job_name:
          type: string
          description: Unique job name
          example: "daily-backup"
        host:
          type: string
          description: Host where the job runs
          example: "db-server-01"
        api_key:
          type: string
          description: Custom API key (optional, auto-generated if not provided)
          example: "cm_custom123456789abcdef123456789abcdef123456789abc"
        automatic_failure_threshold:
          type: integer
          description: "Seconds after which job is considered failed (default: 3600)"
          example: 7200
        labels:
          type: object
          additionalProperties:
            type: string
          description: User-defined labels for the job
          example:
            env: "prod"
            team: "platform"
            type: "backup"
        status:
          type: string
          enum: ["active", "maintenance", "paused"]
          description: "Job lifecycle status (default: active)"
          example: "active"
      required:
        - job_name
        - host

    UpdateJobRequest:
      type: object
      properties:
        job_name:
          type: string
          description: Updated job name
          example: "daily-backup-v2"
        host:
          type: string
          description: Updated host name
          example: "db-server-02"
        api_key:
          type: string
          description: Updated API key
          example: "cm_new123456789abcdef123456789abcdef123456789abcd"
        automatic_failure_threshold:
          type: integer
          description: Updated failure threshold in seconds
          example: 7200
        labels:
          type: object
          additionalProperties:
            type: string
          description: Updated labels (replaces existing labels completely)
          example:
            env: "staging"
            team: "devops"
        status:
          type: string
          enum: ["active", "maintenance", "paused"]
          description: Updated job status
          example: "maintenance"

    JobResult:
      type: object
      properties:
        job_name:
          type: string
          description: Name of the job (must match API key)
          example: "daily-backup"
        host:
          type: string
          description: Host name (must match API key)
          example: "db-server-01"
        status:
          type: string
          enum: ["success", "failure"]
          description: Execution result status
          example: "success"
        labels:
          type: object
          additionalProperties:
            type: string
          description: Additional labels for this execution
          example:
            env: "prod"
            backup_type: "full"
        duration:
          type: integer
          description: Execution duration in seconds
          example: 120
        output:
          type: string
          description: Optional execution output or error message
          example: "Backup completed successfully. 1.2GB transferred."
        timestamp:
          type: string
          format: date-time
          description: Execution timestamp (defaults to current time if not provided)
          example: "2025-10-30T19:56:00Z"
      required:
        - job_name
        - host
        - status

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Job result submitted successfully"
        timestamp:
          type: string
          format: date-time
          example: "2025-10-30T19:56:00Z"

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
          example: "Job name and host are required"
        timestamp:
          type: string
          format: date-time
          description: Error timestamp
          example: "2025-10-30T19:56:00Z"
      required:
        - error
        - timestamp

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "ok"
        timestamp:
          type: string
          format: date-time
          example: "2025-10-30T19:56:00Z"
        version:
          type: string
          example: "0.3.0"

    DashboardRuntimeConfig:
      type: object
      required: [base_path, title, page_size, sse_enabled, polling_fallback, polling_interval]
      properties:
        base_path: {type: string, example: /dashboard}
        title: {type: string, example: Cron Monitor}
        page_size: {type: integer, minimum: 1, maximum: 100, example: 25}
        sse_enabled: {type: boolean, example: true}
        polling_fallback: {type: boolean, example: true}
        polling_interval: {type: integer, minimum: 1, example: 5}

    JobSearchResult:
      type: object
      required: [jobs, total_count, page, page_size, total_pages, has_next, has_previous]
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        total_count: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 100}
        total_pages: {type: integer, minimum: 0}
        has_next: {type: boolean}
        has_previous: {type: boolean}
        search_query: {type: string}

    DashboardEvent:
      type: object
      required: [id, type, timestamp]
      properties:
        id: {type: string}
        type:
          type: string
          enum: [connected, heartbeat, reset, job-status-change, job-created, job-updated, job-deleted]
        job_id: {type: integer}
        timestamp: {type: string, format: date-time}

    DashboardError:
      type: object
      required: [code, message, timestamp]
      properties:
        code: {type: string, example: validation}
        message: {type: string, example: job validation failed}
        fields:
          type: object
          additionalProperties: {type: string}
        timestamp: {type: string, format: date-time}

  responses:
    DashboardBadRequestError:
      description: Invalid dashboard request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DashboardError'

    DashboardUnauthorizedError:
      description: Missing or invalid dashboard Basic credentials
      headers:
        WWW-Authenticate:
          schema: {type: string}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DashboardError'

    DashboardNotFoundError:
      description: Dashboard job not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DashboardError'

    DashboardConflictError:
      description: Dashboard job conflicts with an existing job
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DashboardError'

    BadRequestError:
      description: Bad request - invalid input data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Job name and host are required"
            timestamp: "2025-10-30T19:56:00Z"

    UnauthorizedError:
      description: Unauthorized - missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "missing or invalid API key"
            timestamp: "2025-10-30T19:56:00Z"

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "job not found"
            timestamp: "2025-10-30T19:56:00Z"

    ConflictError:
      description: Conflict - resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "job already exists"
            timestamp: "2025-10-30T19:56:00Z"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "failed to create job"
            timestamp: "2025-10-30T19:56:00Z"

tags:
  - name: Dashboard
    description: Portal-relative job management and realtime endpoints protected by HTTP Basic authentication
  - name: Job Management
    description: CRUD operations for job definitions (requires admin API key)
  - name: Job Results
    description: Job execution result submissions (requires per-job API key)
  - name: Monitoring
    description: Prometheus metrics and monitoring endpoints
  - name: Health
    description: Health check and status endpoints
